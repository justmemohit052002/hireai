# ==============================================================================
# HireAI Backend - Safe Test Configuration Profile ('test')
# ==============================================================================
spring.application.name=hireai-backend-test

# DataSource: Uses safe fallback test credentials for local test runs
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hireai}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security & CORS
app.cors.allowed-origins=http://localhost:5173

# JWT Test Secret (Valid 256-bit Base64 for testing purposes)
jwt.secret=${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci1oaXJlYWktdGVzdGluZy1wdXJwb3Nlcy1vbmx5LW11c3QtYmUtNjQtYnl0ZXM=}
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000

# AI Engine test key
ai-engine.base-url=http://localhost:8000
ai-engine.internal-key=${AI_ENGINE_INTERNAL_KEY:test-ai-engine-internal-key}

# Disable admin seeding during tests
hireai.admin.seed.enabled=false
hireai.admin.seed.password=

# Mail disabled for tests
hireai.mail.enabled=false
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@hireai.dev
spring.mail.password=test

# Rate Limiter & Docs
hireai.rate-limit.enabled=false
springdoc.api-docs.enabled=false
