# ===============================
# Application
# ===============================
spring.application.name=hireai-backend

# ===============================
# Server
# ===============================
server.port=8080

# ===============================
# PostgreSQL Database
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/hireai
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=DEBUG

# ===============================
# JWT Configuration
# ===============================
# Replace the value below with the Base64 string printed by JwtSecretGenerator
jwt.secret=iwRolr1qVZ1SunwAhcbEDbdIGFBr3IhoeXDdZMN5LWk+/Z81/9qcYpUVrHammXxHUNwrvGfz3c2Uf9XBwj8wsw==

# 15 Minutes
jwt.access-token-expiration=900000

# 7 Days
jwt.refresh-token-expiration=604800000

# ===============================
# ATS & AI LLM Configuration
# ===============================
ats.shortlist-threshold=70
ats.llm.enabled=true
ats.llm.service-url=http://localhost:8000/api/v1/match/score
ats.llm.timeout-ms=30000

# ===============================
# AI Engine Microservice
# ===============================
ai-engine.base-url=http://localhost:8000
ai-engine.timeout-ms=120000
ai-engine.polling-interval-ms=3000
ai-engine.polling-max-attempts=30

# ===============================
# File Upload & Resume Storage
# ===============================
file.upload-dir=uploads/resumes
resume.max-file-size=10485760
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===============================
# Automated Email Notifications
# ===============================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:mohitpc2002@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:fibrjnlkmukgdmtk}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

hireai.mail.enabled=true
hireai.mail.from=mohitpc2002@gmail.com
hireai.mail.sender-name=HireAI Recruitment Platform

# ===============================
# Swagger / OpenAPI UI Configuration
# ===============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.persist-authorization=true
springdoc.swagger-ui.try-it-out-enabled=true
