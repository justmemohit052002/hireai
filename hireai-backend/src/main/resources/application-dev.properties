# ==============================================================================
# HireAI Backend - Development Profile Configuration ('dev')
# Activate with: SPRING_PROFILES_ACTIVE=dev or --spring.profiles.active=dev
# ==============================================================================

# Note: ddl-auto=update is strictly for local development.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false

# Development mail mode: default to LOG (simulated console dispatch without SMTP credentials)
hireai.mail.mode=${HIREAI_MAIL_MODE:LOG}

# Verbose logging restricted to HireAI platform packages (suppresses noisy security/web debug dumps)
logging.level.com.vionsys.hireai=DEBUG

# Dev profile demo user password (read from property / environment variable)
hireai.dev.demo-password=${DEV_DEMO_PASSWORD:}

# Enable mock OAuth tokens for offline local developer convenience
hireai.oauth.allow-mock-tokens=true
